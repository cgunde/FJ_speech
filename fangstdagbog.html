<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fangstdagbog</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap');

  :root {
    --ink:     #1a1f1c;
    --paper:   #f0ede6;
    --water:   #2d5a6e;
    --water-lt:#3d7a95;
    --reed:    #7a9e5e;
    --sand:    #c8b98a;
    --fog:     #e2ddd4;
    --err:     #8b3a2a;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    background: var(--water);
    color: #fff;
    padding: 1.25rem 2rem;
    display: flex;
    align-items: baseline;
    gap: 1rem;
  }
  header h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.4rem;
    letter-spacing: -0.02em;
  }
  header span {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    opacity: 0.6;
    letter-spacing: 0.05em;
  }

  /* ── Layout ── */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    padding: 2rem;
    gap: 2rem;
  }

  @media (max-width: 700px) {
    main { grid-template-columns: 1fr; padding: 1rem; }
  }

  /* ── Panel ── */
  .panel {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .panel-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--water);
    font-weight: 500;
  }

  /* ── Record button ── */
  .record-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    padding: 2rem;
    background: var(--fog);
    border-radius: 4px;
    border: 1px solid var(--sand);
  }

  #btn-record {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 3px solid var(--water);
    background: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  #btn-record:hover { background: var(--fog); transform: scale(1.04); }
  #btn-record.recording {
    background: var(--err);
    border-color: var(--err);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(139,58,42,0.35); }
    50%       { box-shadow: 0 0 0 12px rgba(139,58,42,0); }
  }

  .mic-icon { transition: fill 0.15s; }
  #btn-record.recording .mic-icon { fill: #fff; }

  .record-status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--water);
    min-height: 1.2em;
    text-align: center;
  }
  #btn-record.recording ~ .record-status { color: var(--err); }

  /* ── Interim transcript ── */
  #interim {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: #888;
    min-height: 1.4em;
    padding: 0 0.25rem;
    font-style: italic;
  }

  /* ── Textarea ── */
  textarea {
    width: 100%;
    flex: 1;
    min-height: 220px;
    padding: 1rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    line-height: 1.65;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--sand);
    border-radius: 4px;
    resize: vertical;
    outline: none;
    transition: border-color 0.15s;
  }
  textarea:focus { border-color: var(--water-lt); }
  textarea::placeholder { color: #b0a990; }

  /* ── Buttons row ── */
  .btn-row {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  button.action {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 0.02em;
    padding: 0.6rem 1.3rem;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  button.action:hover:not(:disabled) { opacity: 0.85; transform: translateY(-1px); }
  button.action:disabled { opacity: 0.35; cursor: default; }

  .btn-send    { background: var(--water);  color: #fff; }
  .btn-clear   { background: var(--fog);    color: var(--ink); border: 1px solid var(--sand); }
  .btn-resend  { background: var(--reed);   color: #fff; }

  /* ── Settings ── */
  .settings {
    background: var(--fog);
    border: 1px solid var(--sand);
    border-radius: 4px;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .settings label {
    font-size: 0.78rem;
    color: #666;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .settings input {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    padding: 0.4rem 0.6rem;
    border: 1px solid var(--sand);
    border-radius: 3px;
    background: #fff;
    color: var(--ink);
    outline: none;
  }
  .settings input:focus { border-color: var(--water-lt); }

  /* ── Result panel ── */
  #result-wrap {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #result-wrap.visible { opacity: 1; }

  #result-box {
    background: #fff;
    border: 1px solid var(--sand);
    border-radius: 4px;
    padding: 1.25rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.82rem;
    line-height: 1.7;
    min-height: 220px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* field rows inside result */
  .field { display: flex; gap: 0.5rem; margin-bottom: 0.35rem; }
  .field-key {
    color: var(--water);
    font-weight: 500;
    min-width: 130px;
    flex-shrink: 0;
  }
  .field-val { color: var(--ink); }
  .field-empty { color: #aaa; font-style: italic; }

  /* ── Spinner ── */
  #spinner {
    display: none;
    align-items: center;
    gap: 0.75rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--water);
  }
  #spinner.active { display: flex; }
  .dot-wave span {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--water);
    animation: wave 1.2s ease-in-out infinite;
  }
  .dot-wave span:nth-child(2) { animation-delay: 0.15s; }
  .dot-wave span:nth-child(3) { animation-delay: 0.30s; }
  @keyframes wave {
    0%, 60%, 100% { transform: translateY(0); }
    30%           { transform: translateY(-6px); }
  }

  /* ── Error ── */
  #error-msg {
    display: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--err);
    background: #fdf0ee;
    border: 1px solid #e8c5be;
    border-radius: 3px;
    padding: 0.6rem 0.8rem;
  }
  #error-msg.visible { display: block; }

  /* ── Raw toggle ── */
  #raw-wrap { display: none; }
  #raw-wrap.visible { display: block; }
  #raw-box {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    color: #777;
    background: var(--fog);
    border: 1px solid var(--sand);
    border-radius: 3px;
    padding: 0.75rem;
    white-space: pre-wrap;
    word-break: break-word;
    margin-top: 0.5rem;
  }
  summary { cursor: pointer; font-size: 0.75rem; color: #888; user-select: none; }

  /* ── Divider ── */
  .divider {
    width: 1px;
    background: var(--sand);
    align-self: stretch;
  }
  @media (max-width: 700px) { .divider { display: none; } }

  /* waterline decoration */
  .waterline {
    height: 3px;
    background: linear-gradient(90deg, var(--water) 0%, var(--water-lt) 50%, var(--reed) 100%);
  }
</style>
</head>
<body>

<div class="waterline"></div>
<header>
  <h1>Fangstdagbog</h1>
  <span>TALE → TEKST → DATA</span>
</header>

<main>
  <!-- LEFT: diktering -->
  <div class="panel">
    <div class="panel-label">Diktering</div>

    <div class="record-wrap">
      <button id="btn-record" title="Start/stop optagelse">
        <!-- mic SVG -->
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
          <rect class="mic-icon" x="9" y="2" width="6" height="12" rx="3" fill="var(--water)"/>
          <path d="M5 11a7 7 0 0 0 14 0" stroke="var(--water)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <line x1="12" y1="18" x2="12" y2="22" stroke="var(--water)" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="9"  y1="22" x2="15" y2="22" stroke="var(--water)" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="record-status" id="record-status">Tryk for at diktere</div>
    </div>

    <div id="interim"></div>

    <textarea id="transcript" placeholder="Din diktering vises her — ret til hvis nødvendigt…" rows="8" spellcheck="true" lang="da"></textarea>

    <div class="btn-row">
      <button class="action btn-send" id="btn-send" disabled>Kopiér tekst</button>
      <button class="action btn-clear" id="btn-clear">Ryd</button>
    </div>

    <div id="error-msg"></div>
  </div>
</main>

<script>
// ── DOM refs ────────────────────────────────────────────────────────
const btnRecord   = document.getElementById('btn-record');
const recStatus   = document.getElementById('record-status');
const interimEl   = document.getElementById('interim');
const transcriptEl= document.getElementById('transcript');
const btnSend     = document.getElementById('btn-send');
const btnClear    = document.getElementById('btn-clear');
const errorMsg    = document.getElementById('error-msg');

// ── State ───────────────────────────────────────────────────────────
let mediaRecorder = null;
let audioChunks   = [];
let isRecording   = false;
let lastJson      = null;
let recordTimer   = null;
let seconds       = 0;

// ── Recording ───────────────────────────────────────────────────────
btnRecord.addEventListener('click', () => {
  isRecording ? stopRecording() : startRecording();
});

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      await transcribeAudio(blob);
    };

    mediaRecorder.start();
    isRecording = true;
    btnRecord.classList.add('recording');
    seconds = 0;
    recStatus.textContent = 'Optager… 0s — tryk igen for at stoppe';
    recordTimer = setInterval(() => {
      seconds++;
      recStatus.textContent = `Optager… ${seconds}s — tryk igen for at stoppe`;
    }, 1000);
    interimEl.textContent = '';
  } catch (err) {
    showError('Mikrofon ikke tilgængelig: ' + err.message);
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  isRecording = false;
  clearInterval(recordTimer);
  btnRecord.classList.remove('recording');
  recStatus.textContent = 'Transskriberer…';
  interimEl.textContent = '';
}

// ── Whisper transskribering ─────────────────────────────────────────
async function transcribeAudio(blob) {
  const whisperUrl = llmUrl.value.replace('/api/generate', '').replace(/\/$/, '')
    .replace('11434', '5000') + '/transcribe';

  // Brug whisper-url feltet direkte hvis det allerede peger på /transcribe
  const endpoint = `https://sabbath-banish-silencer.ngrok-free.dev/transcribe`;

  const form = new FormData();
  form.append('audio', blob, 'optagelse.webm');

  try {
    const res = await fetch(endpoint, { method: 'POST', body: form, headers: { 'ngrok-skip-browser-warning': 'true' } });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const tekst = data.tekst ?? data.text ?? '';
    transcriptEl.value = (transcriptEl.value.trim()
      ? transcriptEl.value.trim() + ' ' : '') + tekst.trim();
    updateSendBtn();
    recStatus.textContent = 'Tryk for at diktere';
    interimEl.textContent = tekst ? '✓ Transskriberet' : '';
    setTimeout(() => { interimEl.textContent = ''; }, 2000);
  } catch (err) {
    recStatus.textContent = 'Tryk for at diktere';
    showError('Whisper-fejl: ' + err.message + ' — kører serveren på port 5000?');
  }
}

function updateSendBtn() {
  btnSend.disabled = transcriptEl.value.trim().length === 0;
}

transcriptEl.addEventListener('input', updateSendBtn);

btnClear.addEventListener('click', () => {
  transcriptEl.value = '';
  interimEl.textContent = '';
  updateSendBtn();
  hideResult();
  hideError();
});

btnSend.addEventListener('click', () => {
  navigator.clipboard.writeText(transcriptEl.value.trim())
    .then(() => {
      btnSend.textContent = 'Kopieret ✓';
      setTimeout(() => { btnSend.textContent = 'Kopiér tekst'; }, 2000);
    })
    .catch(() => showError('Kunne ikke kopiere — prøv manuelt'));
});

// ── UI helpers ─────────────────────────────────────────────────────
function showError(msg){ errorMsg.textContent = '⚠ ' + msg; errorMsg.style.display = 'block'; }
function hideError()   { errorMsg.style.display = 'none'; }
</script>
</body>
</html>
